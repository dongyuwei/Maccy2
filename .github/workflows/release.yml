name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The code uses macOS 26 APIs guarded by #available, which requires
      # the Xcode 26 SDK; runners ship several Xcodes, pick the newest stable.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Maccy.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

          APP="build/Build/Products/Release/Maccy.app"
          codesign --force --deep -s - "$APP"

          mkdir -p dist
          ditto -c -k --sequesterResources --keepParent "$APP" dist/Maccy.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          TAG="build-${SHA}"
          TITLE="Automated build $(date '+%Y-%m-%d %H:%M') (${SHA})"

          # Commit subjects since the previous release tag (excluding this
          # commit's own tag, so workflow re-runs don't produce an empty range)
          RANGE="HEAD"
          for t in $(git tag --sort=-creatordate); do
            if [ "$t" != "$TAG" ]; then RANGE="${t}..HEAD"; break; fi
          done
          CHANGELOG="$(git log --pretty=format:'%s' "$RANGE" | head -n 30)"

          NOTES="$(printf 'Automated release built from commit %s.\n\nAd-hoc signed build: if macOS blocks the first launch, run:\n  xattr -dr com.apple.quarantine Maccy.app' "$SHA")"
          if [ -n "$CHANGELOG" ]; then
            NOTES="$(printf '%s\n\n%s' "$NOTES" "$CHANGELOG")"
          fi

          # Replace any existing release for this commit (e.g. on workflow re-run)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" dist/Maccy.zip \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
